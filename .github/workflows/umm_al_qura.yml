# Once a year, fetches the official Umm al-Qura timetables for every Saudi
# city from ummulqura.org.sa (with KACST's permission), commits them to api/
# and republishes the API.
name: Fetch Umm al-Qura timetables

on:
  schedule:
    # 03:00 UTC on 1 December, so next year's tables are ready in time.
    - cron: '0 3 1 12 *'
  # Adds a "Run workflow" button on the Actions tab.
  workflow_dispatch:

permissions:
  contents: write # commit the fetched files
  actions: write # start the publish workflow afterwards

# Never run two fetches at once.
concurrency:
  group: umm-al-qura
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install Flutter (same version as on your Mac)
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - run: flutter pub get

      # Fetch nothing if our reader's own tests fail.
      - run: flutter test test/unit

      # About an hour: one city at a time, with pauses, to go easy on the site.
      # Any unexpected page stops the job, and nothing is committed.
      - name: Fetch every city, this year and next
        run: dart run tool/fetch_umm_al_qura.dart api

      - name: Commit any changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: update Umm al-Qura timetables"
            # main may have moved during the hour-long fetch.
            git pull --rebase origin main
            git push
          fi

      # Pushes made by a workflow don't start other workflows, so ask for the
      # publish directly.
      - name: Publish
        run: gh workflow run api.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
